# Copy this file to config/config.yaml and adjust as needed.
# config/config.yaml is gitignored - never commit local paths here.
#
# Models are served locally via Ollama (free, open-weight - see
# cluster/setup.md for the Wits mscluster HPC setup this project runs
# against). No API key is needed for this: `ollama.base_url` below is
# normally left unset, since `OllamaLLMClient` reads the cluster's
# per-Slurm-job `OLLAMA_HOST` env var directly (see ~/llm/env.sh on the
# cluster). Set it explicitly only for local/off-cluster testing.

environment:
  ontology_path: config/environment_ontology.yaml
  safety_rules_path: config/safety_rules.yaml

dataset:
  path: data/instructions.jsonl

# Model used per agent role, as Ollama model tags. Kept separate so a
# smaller/faster model can serve the highest-call-volume role (Critic) and
# the larger model is reserved for roles where reasoning quality matters
# most (Planner, NL->LTL Translation, and the Single-LLM+LTL baseline, which
# has to do a full single-pass safety judgement with no Critic to catch its
# mistakes).
models:
  planner: gemma4:e4b
  critic: qwen3.5:4b
  translator: gemma4:e4b
  single_llm: gemma4:e4b # used by Baseline A / Single-LLM+LTL

# ollama:
#   base_url: http://127.0.0.1:11434  # uncomment to override OLLAMA_HOST
#   timeout: 300
#   max_retries: 2

agent:
  ambiguity_margin: 0.15 # Hatori et al.-style top-1 vs top-2 confidence margin
  max_refinement_attempts: 2 # reprompting-loop bound on UNSAT (N)
  translation_max_retries: 3

evaluation:
  repeats: 3
  confidence_level: 0.95
  ablations:
    - remove_verifier
    - remove_critic
    - remove_clarification
  results_dir: results

logging:
  level: INFO
  format: json
