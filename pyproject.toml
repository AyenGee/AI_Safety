[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent_filter"
version = "0.1.0"
description = "LTL-augmented multi-agent intent filtering for LLM-enabled robots (Wits Honours research artifact)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "George Ayensu" }]

# Ollama (the default LLM backend, run locally on the cluster - see
# cluster/setup.md) needs no extra dependency: OllamaLLMClient talks to it
# over stdlib urllib. anthropic is kept as an optional extra only so the
# historical (already-reported) Anthropic-backed results stay explainable/
# reproducible later - nothing in this project's default path needs it.
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "flloat>=0.3.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
anthropic = [
    "anthropic>=0.40.0",
]

[tool.setuptools.packages.find]
include = ["intent_filter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
